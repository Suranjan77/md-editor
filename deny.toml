# cargo-deny: licence and duplicate-crate policy, run in CI (`cargo deny check licenses bans`).
# Vulnerabilities are checked separately with `cargo audit`.

[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "OFL-1.1",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "GPL-3.0-or-later",
]
# Keep the list stable as dependencies come and go.
unused-allowed-license = "allow"

[bans]
# iced/wgpu pull in several versions of common crates; not actionable locally.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
