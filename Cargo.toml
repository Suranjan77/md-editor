[workspace]
members = ["core", "native"]
# Sub-repos built as patched dependencies, not workspace members.
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Release builds are what ships in the download archives, so trade build time
# for a smaller, faster binary.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Shared lint policy (code-health plan W2). Crate- and module-specific
# additions live in `core/src/lib.rs` and `native/src/app/mod.rs`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
large_enum_variant = "warn"
# Not enabled: needless_pass_by_value. It flags the props-struct-by-value
# pattern views use (and that W6 prescribes) and iced's by-value events.

# winit with Wayland tablet (zwp_tablet_v2) input, so a pen reports pressure,
# eraser and barrel buttons on Linux. A vendored copy of the exact release
# iced 0.14 resolves to; our changes are in vendor/winit/md-editor-patches/.
[patch.crates-io]
winit = { path = "vendor/winit" }
