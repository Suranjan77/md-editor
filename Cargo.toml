[workspace]
members = ["core", "native"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

# Release builds are what ships in the download archives, so trade build time
# for a smaller, faster binary.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
