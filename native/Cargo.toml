[package]
name = "md-editor-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Native desktop markdown editor with vault search, PDF support, and study tracking."

[[bin]]
name = "md-editor"
path = "src/main.rs"

[dependencies]
md-editor-core = { path = "../core" }
iced = { version = "0.14", features = ["canvas", "image", "advanced", "tokio"] }
# The `Program` trait the iced builders implement; named so `main::program`
# can be handed to `iced_test`'s emulator. Already in the tree via iced.
iced_program = "0.14"
rfd = "0.17.2"
# Clipboard images and file lists (iced's clipboard is text-only).
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
ropey = "1.6"
image = "0.25"
chrono = "0.4"
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
syntect = "5"
regex = "1"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13"
ratex-render = { version = "0.1.7", features = ["embed-fonts"] }
ratex-parser = "0.1.7"
ratex-layout = "0.1.7"
ratex-types = "0.1.7"
uuid = { version = "1", features = ["v4"] }
notify = "8"
tokio = { version = "1", features = ["sync", "time"] }
bytemuck = { version = "1.25.1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
# ShellExecuteW for external links, plus the pointer input stack and window
# subclassing used to capture pen pressure for handwritten notes.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_UI_Input_Pointer",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
# Headless end-to-end tests (`src/e2e/`): the real program in iced's emulator.
iced_test = "0.14"
# The telemetry pipeline Comet uses, recorded headlessly instead of in its GUI.
iced_debug = { version = "0.14", features = ["enable"] }
iced_beacon = "0.14"
tokio = { version = "1", features = ["rt", "net"] }

[lints]
workspace = true
